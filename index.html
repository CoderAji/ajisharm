<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajitesh Sharma</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥪</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Fixed 3D stage. Layers stack along Z as you scroll up. -->
<div class="stage" aria-hidden="true">
  <div class="sandwich">
    <div class="layer bun-bottom" data-step="0"></div>
    <div class="layer lettuce"    data-step="1"></div>
    <div class="layer tomato"     data-step="2"></div>
    <div class="layer cheese"     data-step="3"></div>
    <div class="layer patty"      data-step="4"></div>
    <div class="layer ketchup"    data-step="5"></div>
    <div class="layer bun-top"    data-step="6"></div>
  </div>
  <div class="bite bite-a"></div>
  <div class="bite bite-b"></div>
</div>

<!-- DOM order == reading order == bottom-to-top on screen. -->
<main>
  <section id="s0">
    <p class="kicker">scroll up</p>
    <h1>Ajitesh Sharma</h1>
    <p>Bottom slice is down. Everything else is above you.</p>
  </section>

  <section id="s1">
    <h2>Lettuce</h2>
    <p>Placeholder. Text and images go here.</p>
  </section>

  <section id="s2">
    <h2>Tomato</h2>
    <p>Placeholder.</p>
  </section>

  <section id="s3">
    <h2>Cheese</h2>
    <p>Placeholder.</p>
  </section>

  <section id="s4">
    <h2>The good part</h2>
    <p>Placeholder.</p>
  </section>

  <section id="s5">
    <h2>Ketchup</h2>
    <p>Placeholder.</p>
  </section>

  <section id="s6">
    <h2>Top slice</h2>
    <p>Placeholder.</p>
  </section>

  <section id="s7" class="end">
    <h2>Gone.</h2>
    <p>Check the tab.</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
